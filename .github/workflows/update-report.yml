name: Update Congressional Trade Report

on:
  # Run every weekday at 7 AM Eastern (11:00 UTC)
  schedule:
    - cron: '0 11 * * 1-5'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      refresh_reference:
        description: 'Also refresh Congress reference data'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check if reference data refresh is due
        id: ref_check
        run: |
          # Refresh every 2 weeks, or if manually requested
          MANUAL="${{ github.event.inputs.refresh_reference }}"
          if [ "$MANUAL" = "true" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            # Check age of member_bioguide.json
            if [ -f member_bioguide.json ]; then
              AGE_DAYS=$(( ($(date +%s) - $(date -r member_bioguide.json +%s)) / 86400 ))
              echo "Reference data is $AGE_DAYS days old"
              if [ "$AGE_DAYS" -ge 14 ]; then
                echo "refresh=true" >> "$GITHUB_OUTPUT"
              else
                echo "refresh=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "refresh=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Refresh Congress reference data
        if: steps.ref_check.outputs.refresh == 'true'
        run: |
          python3 update_reference_data.py
          echo "Reference data refreshed."

      - name: Run pipeline (fetch → compute → skeleton)
        id: pipeline
        run: |
          python3 run_pipeline.py 2>&1 | tee digest.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Check for NO_CHANGES
          if [ $EXIT_CODE -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new trades detected — skipping report generation."
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Pipeline failed with exit code $EXIT_CODE"
            cat digest.txt
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract skeleton path from digest
        if: steps.pipeline.outputs.skip != 'true'
        id: skeleton
        run: |
          SKELETON=$(grep "PIPELINE_READY:" digest.txt | sed 's/.*skeleton=//' | sed 's/ .*//')
          SLUG=$(grep "PIPELINE_READY:" digest.txt | sed 's/.*slug=//' | tr -d '[:space:]')
          echo "path=$SKELETON" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Skeleton: $SKELETON  Slug: $SLUG"

      - name: Generate fills via Claude API
        if: steps.pipeline.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 auto_fill.py \
            --digest digest.txt \
            --skeleton "${{ steps.skeleton.outputs.path }}" \
            --out fills.json

      - name: Apply fills to skeleton and generate report
        if: steps.pipeline.outputs.skip != 'true'
        run: |
          SKELETON="${{ steps.skeleton.outputs.path }}"
          SLUG="${{ steps.skeleton.outputs.slug }}"

          if [ "$SLUG" = "default" ] || [ -z "$SLUG" ]; then
            python3 fill_skeleton.py \
              --skeleton "$SKELETON" \
              --fills fills.json \
              --out analysis/analysis.json
            python3 generate_report.py analysis/analysis.json
          else
            python3 fill_skeleton.py \
              --skeleton "$SKELETON" \
              --fills fills.json \
              --out "analysis/analysis_${SLUG}.json"
            python3 generate_report.py "analysis/analysis_${SLUG}.json"
          fi

      - name: Build leaderboard page (if data exists)
        run: |
          if ls scoring/output/leaderboard_*.xlsx 1>/dev/null 2>&1; then
            python3 build_leaderboard.py --out site
          else
            echo "No leaderboard data — skipping."
          fi

      - name: Build site index and RSS feed
        run: |
          python3 build_site.py --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
